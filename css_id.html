<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mencoba Selector ID</title>
    <style>
        #para1{
            text-align: center;
            color: blueviolet;
            font-weight: bold;
        }
        /* Tambahan latihan: id para2 */
        #para2{
            text-align: left;
            color: cyan;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <p id="para1">Belajar CSS, tampilan ini sudah menggunakan CSS</p>
    <p id="para2">Ini adalah paragraf kedua yang menggunakan ID para2</p>
    <h1>Paragraf ini belum menggunakan CSS</h1>
</body>
</html>
