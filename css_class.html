<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contoh Class CSS</title>
    <style>
        .tanya{ color: bisque; }
        .jawab{ color: blue; }
        /* Tambahan latihan: class tanyajawab untuk mengubah paragraf 2 */
        .tanyajawab{ color: greenyellow; font-weight: bold; }
    </style>
</head>
<body>
    <p class="tanya">Ini menggunakan class tanya</p>
    <p class="jawab tanyajawab">Ini menggunakan class jawab</p>
</body>
</html>
